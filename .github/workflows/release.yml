name: Build, test and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WINTUN: "wintun-0.14.1.zip"
  PLATFORM_TOOLS: "platform-tools-latest-windows.zip"

jobs:
  relay-tests:
    name: Relay engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p core test installDist --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: relay-desktop, path: core/build/install/core }

  e2e:
    name: End-to-end router test (TUN -> phone router)
    needs: relay-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with: { name: relay-desktop, path: core/build/install/core }
      - name: Run
        run: |
          chmod +x core/build/install/core/bin/core tests/e2e/run-router-e2e.sh
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" tests/e2e/run-router-e2e.sh

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle -p android :app:assembleRelease --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk PdaNet-Next.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: PdaNet-Next.apk }

  windows:
    name: Windows app
    needs: [android, relay-tests]
    runs-on: windows-latest
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build
        run: dotnet build windows/PdaNetNext.csproj -c Release -nologo
      - uses: actions/download-artifact@v4
        with: { name: relay-desktop, path: relay }
      - name: Logic tests (against a live relay)
        run: |
          $relay = Start-Process -PassThru -WindowStyle Hidden -FilePath relay/bin/core.bat -ArgumentList "--bind","127.0.0.1","--port","28080"
          for ($i = 0; $i -lt 40; $i++) { if ((Test-NetConnection 127.0.0.1 -Port 28080 -WarningAction SilentlyContinue).TcpTestSucceeded) { break }; Start-Sleep -Milliseconds 500 }
          $env:RELAY_PORT = "28080"
          dotnet run --project windows/tests -nologo
          $code = $LASTEXITCODE
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { exit 1 }
      - name: Fetch adb and wintun
        run: |
          Invoke-WebRequest "https://dl.google.com/android/repository/$env:PLATFORM_TOOLS" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          Invoke-WebRequest "https://www.wintun.net/builds/$env:WINTUN" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: apk }
      - name: Package
        run: |
          $out = "release/PdaNet-Next"
          New-Item -ItemType Directory -Force "$out/bin" | Out-Null
          Copy-Item windows/out/bin/PdaNetNext/Release/PdaNet-Next.exe, windows/out/bin/PdaNetNext/Release/PdaNet-Next.exe.config $out
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll "$out/bin"
          Copy-Item wt/wintun/bin/amd64/wintun.dll "$out/bin"
          Copy-Item wt/wintun/LICENSE.txt "$out/bin/wintun-LICENSE.txt"
          Copy-Item apk/PdaNet-Next.apk "$out/bin"
          Copy-Item README.md $out
          Compress-Archive -Path $out -DestinationPath PdaNet-Next-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows-zip, path: PdaNet-Next-Windows.zip }

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-zip }
      - uses: actions/download-artifact@v4
        with: { name: android-apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: PdaNet-Next v3.0.${{ github.run_number }}
          make_latest: true
          files: |
            PdaNet-Next-Windows.zip
            PdaNet-Next.apk
          body: |
            1. Install `PdaNet-Next.apk` on the phone (or let the Windows app install it over USB).
            2. Turn on USB debugging on the phone and plug in the cable.
            3. Extract `PdaNet-Next-Windows.zip`, run `PdaNet-Next.exe` and press **Connect**.

            "Whole PC" mode makes the phone the PC's router (192.168.42.1) over USB: every app, TCP, UDP
            and ping, goes out through the phone. If a VPN is on in the phone, the PC uses it too.
