name: Build, test and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WINTUN: "wintun-0.14.1.zip"
  PLATFORM_TOOLS: "platform-tools-latest-windows.zip"
  SCRCPY_VERSION: "5.0.1"
  SCRCPY_ZIP: "scrcpy-win64-v5.0.1.zip"
  SCRCPY_SHA256: "b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5"
  GO_VERSION: "1.27.2"
  # Same golang.org/x/mobile as xraybridge/go.mod (gomobile and the bind package must match).
  GOMOBILE_VERSION: "v0.0.0-20260908204917-8b95e45f8d3e"

jobs:
  relay-tests:
    name: Relay engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Test Iranian IP list generator
        run: python3 tools/iran-ip-list/test_generate.py
      - run: gradle -p core test installDist --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: relay-desktop, path: core/build/install/core }

  e2e:
    name: End-to-end router test (TUN -> phone router)
    needs: relay-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with: { name: relay-desktop, path: core/build/install/core }
      - name: Run
        run: |
          chmod +x core/build/install/core/bin/core tests/e2e/run-router-e2e.sh
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" tests/e2e/run-router-e2e.sh

  xray-aar:
    name: Xray bridge (Go tests + AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: xraybridge/go.sum }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Go tests
        working-directory: xraybridge
        run: |
          go vet ./...
          go test ./...
      - name: Build AAR
        working-directory: xraybridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init
          # Same flags as libXray: Xray deps use go:linkname into net (checklinkname=0); 16 KB pages for Android 15+.
          gomobile bind -target=android/arm64,android/arm -androidapi 24 -trimpath \
            -ldflags="-checklinkname=0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" -o xraybridge.aar .
          ls -l xraybridge.aar
      - uses: actions/upload-artifact@v4
        with: { name: xraybridge-aar, path: xraybridge/xraybridge.aar }

  android:
    name: Android APK
    needs: xray-aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Generate Iranian IPv4 list
        run: |
          mkdir -p android/app/src/main/assets
          python3 tools/iran-ip-list/generate.py \
            --min-ranges 500 \
            --output android/app/src/main/assets/iran-ipv4.txt
          count=$(grep -v '^#' android/app/src/main/assets/iran-ipv4.txt | grep -c . || true)
          echo "Generated $count Iranian IPv4 CIDR ranges"
          if [ "$count" -lt 500 ]; then
            echo "Error: expected at least 500 ranges, got $count" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { name: xraybridge-aar, path: android/app/libs }
      - run: gradle -p android :app:assembleRelease --stacktrace
      - run: ls -l android/app/build/outputs/apk/release/app-release.apk
      - run: cp android/app/build/outputs/apk/release/app-release.apk PdaNext.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: PdaNext.apk }

  windows:
    name: Windows app
    needs: [android, relay-tests]
    runs-on: windows-latest
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build
        run: dotnet build windows/PdaNext.csproj -c Release -nologo
      - uses: actions/download-artifact@v4
        with: { name: relay-desktop, path: relay }
      - name: Logic tests (against a live relay)
        run: |
          $relay = Start-Process -PassThru -WindowStyle Hidden -FilePath relay/bin/core.bat -ArgumentList "--bind","127.0.0.1","--port","28080"
          for ($i = 0; $i -lt 40; $i++) { if ((Test-NetConnection 127.0.0.1 -Port 28080 -WarningAction SilentlyContinue).TcpTestSucceeded) { break }; Start-Sleep -Milliseconds 500 }
          $env:RELAY_PORT = "28080"
          dotnet run --project windows/tests -nologo
          $code = $LASTEXITCODE
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { exit 1 }
      - name: Fetch adb, wintun and scrcpy
        run: |
          Invoke-WebRequest "https://dl.google.com/android/repository/$env:PLATFORM_TOOLS" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          Invoke-WebRequest "https://www.wintun.net/builds/$env:WINTUN" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Invoke-WebRequest "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION/$env:SCRCPY_ZIP" -OutFile scrcpy.zip
          $hash = (Get-FileHash scrcpy.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SCRCPY_SHA256.ToLower()) {
            throw "scrcpy SHA256 mismatch: expected $env:SCRCPY_SHA256 but got $hash"
          }
          Expand-Archive scrcpy.zip -DestinationPath scrcpy-raw
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: apk }
      - name: Package
        run: |
          $out = "release/PdaNext"
          New-Item -ItemType Directory -Force "$out/bin" | Out-Null
          New-Item -ItemType Directory -Force "$out/bin/scrcpy" | Out-Null
          Copy-Item windows/out/bin/PdaNext/Release/PdaNext.exe, windows/out/bin/PdaNext/Release/PdaNext.exe.config $out
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll "$out/bin"
          Copy-Item wt/wintun/bin/amd64/wintun.dll "$out/bin"
          Copy-Item wt/wintun/LICENSE.txt "$out/bin/wintun-LICENSE.txt"
          Copy-Item apk/PdaNext.apk "$out/bin"
          Copy-Item scrcpy-raw/scrcpy-win64-v$env:SCRCPY_VERSION/* "$out/bin/scrcpy"
          Copy-Item "$out/bin/scrcpy/LICENSE.txt" "$out/bin/scrcpy-LICENSE.txt"
          Copy-Item README.md $out
          Compress-Archive -Path $out -DestinationPath PdaNext-Windows.zip
      - name: Build MSI installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          $version = (Get-Content VERSION -Raw).Trim()
          wix build windows/installer/PdaNext.wxs -arch x64 `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d Version=$version -d SourceDir="$PWD\release\PdaNext" `
            -o PdaNext-Setup.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the MSI installs and uninstalls
        run: |
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i","PdaNext-Setup.msi","/qn","/l*v","install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\PdaNext\PdaNext.exe")) { throw "PdaNext.exe not installed" }
          if (-not (Test-Path "$env:ProgramFiles\PdaNext\bin\wintun.dll")) { throw "wintun.dll not installed" }
          if (-not (Test-Path "$env:ProgramFiles\PdaNext\bin\scrcpy\scrcpy.exe")) { throw "scrcpy.exe not installed" }
          if (-not (Test-Path "$env:ProgramFiles\PdaNext\bin\scrcpy-LICENSE.txt")) { throw "scrcpy-LICENSE.txt not installed" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/x","PdaNext-Setup.msi","/qn","/l*v","uninstall.log"
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; exit 1 }
          if (Test-Path "$env:ProgramFiles\PdaNext\PdaNext.exe") { throw "PdaNext.exe left behind" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-zip, path: PdaNext-Windows.zip }
      - uses: actions/upload-artifact@v4
        with: { name: windows-msi, path: PdaNext-Setup.msi }

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A release is published once per version: bump VERSION to ship a new one.
      - name: Read version
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v is already released; bump VERSION to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with: { name: windows-zip }
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with: { name: windows-msi }
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with: { name: android-apk }
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: PdaNext ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            PdaNext-Setup.msi
            PdaNext-Windows.zip
            PdaNext.apk
          body: |
            1. Install `PdaNext.apk` on the phone (or let the Windows app install it over USB).
            2. Turn on USB debugging on the phone and plug in the cable.
            3. Install `PdaNext-Setup.msi` (or extract the portable `PdaNext-Windows.zip`), open PdaNext and press **Connect**.

            The phone becomes the PC's router (192.168.42.1) over USB: every app, TCP, UDP and ping,
            goes out through the phone. If a VPN is on in the phone, the PC uses it too.
